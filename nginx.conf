events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------
    # Configuration for your Custom Domain
    # ----------------------------------------------------
    server {
        listen 80;
        server_name manoilo.abrdns.com;

        location / {
            root /usr/share/nginx/html/custom_domain_site;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }

    # ----------------------------------------------------
    # Configuration for your Default Render Address
    # ----------------------------------------------------
    server {
        listen 80;
        server_name web-administration.onrender.com localhost;

        location / {
            root /usr/share/nginx/html/render_default_site;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}